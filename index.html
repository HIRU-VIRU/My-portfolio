<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiruthik's Portfolio</title>
    <script>
      // Apply the visitor's saved accent before first paint (see src/utils/accent.ts)
      try {
        var a = localStorage.getItem("accent");
        if (a && /^#[0-9a-f]{6}$/i.test(a)) {
          var n = parseInt(a.slice(1), 16);
          var s = document.documentElement.style;
          s.setProperty("--accentColor", a);
          s.setProperty("--accentRgb", (n >> 16 & 255) + ", " + (n >> 8 & 255) + ", " + (n & 255));
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
